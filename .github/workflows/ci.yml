name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Match the compiler used to validate 0.5.0; upgrade deliberately with the lockfile.
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 2 --max-time 120 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all fetched history without exposing matched values
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --no-banner .'

  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  linux:
    name: Linux lint, tests and native input
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libibus-1.0-dev libglib2.0-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            dbus-daemon ibus gir1.2-ibus-1.0 gir1.2-pango-1.0 python3-gi \
            xvfb xauth fontconfig fonts-dejavu-core fonts-noto-cjk shellcheck \
            dpkg-dev jq desktop-file-utils gnome-text-editor zenity x11-utils x11-xkb-utils libxtst6 \
            ibus-gtk3 ibus-gtk4 gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            python3-pyqt5 python3-pyqt6 qt6-qpa-plugins
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-linux-ci-v2-core-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-linux-ci-v2-core-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-linux-ci-v1-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install source-only workflow guard dependency
        run: sudo apt-get install --no-install-recommends -y python3-yaml
      - name: Test parallel release graph and unchanged regression gates
        run: /usr/bin/python3 -B scripts/test-ci-release-graph.py
      - name: Lint the native test runner
        run: shellcheck scripts/test-linux-ci.sh scripts/test-linux-apps.sh scripts/test-linux-service.sh scripts/test-tool-chain-audit.sh scripts/test-settings-chain-audit.sh scripts/test-data-chain-audit.sh scripts/package-linux.sh scripts/test-linux-package.sh scripts/test-linux-install.sh scripts/fixtures/linux-install-container.sh scripts/fixtures/trace-native-ibus.sh
      - name: Test strict editor observation and save barriers
        run: python3 scripts/test-editor-observer.py
      - name: Test owned X11 focus ancestry without a display
        run: python3 scripts/test-x11-focus.py
      - name: Test GTK3 event observation before input-method filtering
        run: python3 scripts/test-gtk3-event-observer.py
      - name: Validate functional maturity inventory and its source snapshot
        run: |
          python3 scripts/functional-tensor.py --check
          python3 scripts/test-functional-tensor.py
      - name: Test private IBus diagnostic isolation and failure propagation
        run: python3 scripts/test-native-ibus-trace.py
      - name: Test controlled native model replies and unchanged timing guards
        run: |
          python3 -B scripts/test-ast-guard.py
          python3 -B scripts/run-ast-guard.py test-native-model-fixture.py
      - name: Test appended language and keypad workflow guards
        run: |
          python3 -B scripts/run-ast-guard.py test-language-workflow-coverage.py
          python3 -B scripts/run-ast-guard.py test-keypad-navigation-coverage.py
          python3 -B scripts/run-ast-guard.py test-held-language-coverage.py
          python3 -B scripts/test-custom-language-coverage.py
          python3 -B scripts/test-custom-boundary-coverage.py
          python3 -B scripts/test-custom-continuation-coverage.py
      - name: Test complete vocabulary partitions and unchanged physical assertions
        run: python3 -B scripts/run-ast-guard.py test-vocabulary-partitions.py
      - name: Test final native probe unsubscribe and close ordering
        run: python3 scripts/test-native-probe-teardown.py
      - name: Test bounded custom shortcut parsing and native adapter guards
        run: /usr/bin/python3 -B scripts/test-native-custom-shortcuts.py
      - name: Test appended long custom workflows and unchanged private fixture
        run: python3 -B scripts/test-custom-long-coverage.py
      - name: Test separate physical custom workflow scope and recorder guards
        run: /usr/bin/python3 -B scripts/test-keyboard-custom-scope.py
      - name: Test borrowed IBus signal payload lifetimes
        run: /usr/bin/python3 scripts/test-ibus-signal-lifetime.py
      - name: Lint Rust code and test targets without warnings
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Run the feature-enabled regression suite
        # Some FFI tests share process-wide state and must execute serially.
        run: cargo test --locked --all-features -- --test-threads=1
      - name: Test native IBus composition and candidate synchronization
        run: bash scripts/test-linux-ci.sh ibus
      - name: Test custom shortcut persistence and dispatch on a private IBus
        run: bash scripts/test-linux-ci.sh ibus-custom-shortcuts
      - name: Test offline pack startup through native IBus
        env:
          SUZAKU_NATIVE_PACKS_ONLY: "1"
        run: bash scripts/test-linux-ci.sh ibus
      - name: Test opt-in legacy inline IBus composition
        env:
          SUZAKU_IBUS_INLINE_PREEDIT: "1"
        run: bash scripts/test-linux-ci.sh ibus
      - name: Test slow settings I/O and abandoned settings or language-key controls
        env:
          SUZAKU_NATIVE_CONTROL_IO_ONLY: "1"
        run: bash scripts/test-linux-ci.sh ibus
      - name: Test isolated windows, keyboard input and multilingual GPU rendering
        run: bash scripts/test-linux-ci.sh ui

  linux-apps:
    name: Linux application workflows and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libibus-1.0-dev libglib2.0-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            dbus-daemon ibus gir1.2-ibus-1.0 gir1.2-pango-1.0 python3-gi \
            xvfb xauth fontconfig fonts-dejavu-core fonts-noto-cjk shellcheck \
            dpkg-dev jq desktop-file-utils gnome-text-editor zenity x11-utils x11-xkb-utils libxtst6 \
            ibus-gtk3 ibus-gtk4 gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            python3-pyqt5 python3-pyqt6 qt6-qpa-plugins
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-linux-ci-v2-apps-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-linux-ci-v2-apps-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-linux-ci-v1-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Test English and Chinese typing in real GTK applications on an isolated display
        run: bash scripts/test-linux-apps.sh
      - name: Test GTK3 per-key drafts with default and synchronous IBus transport
        run: |
          bash scripts/test-linux-apps.sh gtk3
          SUZAKU_GTK3_QA_SYNC_MODE=1 bash scripts/test-linux-apps.sh gtk3
      - name: Test native paging, caret following, bottom layout and platform detection
        run: |
          bash scripts/test-linux-apps.sh candidates
          SUZAKU_GTK3_QA_SYNC_MODE=1 bash scripts/test-linux-apps.sh candidates
          bash scripts/test-linux-apps.sh bottom-layout
          SUZAKU_GTK3_QA_SYNC_MODE=1 bash scripts/test-linux-apps.sh bottom-layout
          bash scripts/test-linux-apps.sh auto-layout
          SUZAKU_GTK3_QA_SYNC_MODE=1 bash scripts/test-linux-apps.sh auto-layout
      - name: Test expanded bilingual vocabulary in real GTK input
        run: bash scripts/test-linux-apps.sh vocabulary
      - name: Test owned editor observation across two real windows
        run: bash scripts/test-linux-apps.sh editor
      - name: Test physical keyboard layouts, locks and Compose in real GTK input
        run: bash scripts/test-linux-apps.sh keyboard
      - name: Test physical custom combinations and actual settings recording
        env:
          SUZAKU_KEYBOARD_CUSTOM_SHORTCUTS_ONLY: "1"
        run: bash scripts/test-linux-apps.sh keyboard
      - name: Test stock IBus ordinal and text clicks, navigation and bounded previews
        run: bash scripts/test-linux-apps.sh popup
      - name: Test real input switching, privacy and process reconnection
        run: bash scripts/test-linux-apps.sh lifecycle
      - name: Test private IBus daemon loss and explicit application recovery
        run: bash scripts/test-linux-apps.sh bus-restart
      - name: Test actual systemd retries and explicit stop in an owned container
        run: bash scripts/test-linux-service.sh
      - name: Test Qt workflows, focus cancellation and literal numeric fields
        run: |
          bash scripts/test-linux-apps.sh qt5
          bash scripts/test-linux-apps.sh qt6
      - name: Test isolated settings startup, conflicts and save recovery
        run: bash scripts/test-settings-chain-audit.sh
      - name: Test isolated restore gates, path aliases and data recovery
        run: bash scripts/test-data-chain-audit.sh
      - name: Test data-folder actions against a private file-manager service
        run: >-
          timeout --kill-after=3s 25s dbus-run-session -- env SUZAKU_DATA_QA=1
          /usr/bin/python3 scripts/test-data-folders.py

  linux-package:
    name: Linux release packages and clean installation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libibus-1.0-dev libglib2.0-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            dbus-daemon ibus gir1.2-ibus-1.0 gir1.2-pango-1.0 python3-gi \
            xvfb xauth fontconfig fonts-dejavu-core fonts-noto-cjk shellcheck \
            dpkg-dev jq desktop-file-utils gnome-text-editor zenity x11-utils x11-xkb-utils libxtst6 \
            ibus-gtk3 ibus-gtk4 gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            python3-pyqt5 python3-pyqt6 qt6-qpa-plugins
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-linux-ci-v2-package-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-linux-ci-v2-package-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-linux-ci-v1-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build Linux release binaries
        run: >-
          cargo build --locked --release --all-features
          --bin panel --bin linux_ime_host --bin linux_ime_probe --bin suzaku_tool
      - name: Build Linux distribution packages without installing
        run: bash scripts/package-linux.sh --skip-build
      - name: Verify package contents and launchers in temporary directories
        run: bash scripts/test-linux-package.sh dist
      - name: Install, upgrade and remove in a clean Ubuntu container
        run: bash scripts/test-linux-install.sh dist
      # This is only a short-lived handoff. It is not the accepted download.
      - name: Stage unaccepted Linux packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suzaku-linux-unaccepted-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  linux-artifacts:
    # Keep the previous required-check display name on the all-gates join.
    name: Linux lint, tests, native input and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [linux, linux-apps, linux-package, secrets, format, desktop-check]
    # Always report failures for the required check; never always publish.
    if: ${{ always() }}
    steps:
      - name: Require every regression and package gate to succeed
        env:
          SUZAKU_REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          /usr/bin/python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["SUZAKU_REQUIRED_RESULTS"])
          expected = {"linux", "linux-apps", "linux-package", "secrets", "format", "desktop-check"}
          if set(needs) != expected:
              raise SystemExit("Missing or unexpected required gate results")
          failures = {name: values.get("result") for name, values in needs.items() if values.get("result") != "success"}
          if failures:
              raise SystemExit(f"Required gates did not succeed: {failures}")
          print("PASS: every required regression and installation gate succeeded")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this run's unaccepted Linux candidate
        # Official v4.3.0 tag was checked via the upstream Git refs API; node20.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: suzaku-linux-unaccepted-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
          path: dist
      - name: Bind downloaded packages to the accepted source revision
        env:
          SUZAKU_ACCEPTED_REVISION: ${{ github.sha }}
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, subprocess, tarfile, tempfile, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          target = "x86_64-unknown-linux-gnu"
          root = f"suzaku-{version}-{target}"
          packages = [f"{root}.tar.gz", f"suzaku_{version}_amd64.deb"]
          assets = Path("dist")
          expected = set(packages + [name + ".sha256" for name in packages])
          assert {path.name for path in assets.iterdir()} == expected, "exact four assets required"
          for name in expected:
              path = assets / name
              assert path.is_file() and not path.is_symlink(), name
          for name in packages:
              with (assets / name).open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              assert (assets / (name + ".sha256")).read_text() == f"{digest}  {name}\n", name
          with tarfile.open(assets / packages[0], "r:gz") as archive:
              tar_manifest = archive.extractfile(f"{root}/manifest.json").read()
          with tempfile.TemporaryDirectory(prefix="suzaku-artifact-binding.") as temporary:
              subprocess.run(["dpkg-deb", "--extract", str(assets / packages[1]), temporary], check=True)
              deb_manifest = (Path(temporary) / "usr/share/doc/suzaku/manifest.json").read_bytes()
          assert tar_manifest == deb_manifest, "tar/deb manifests must be identical"
          manifest = json.loads(tar_manifest)
          epoch = int(subprocess.check_output(["git", "log", "-1", "--format=%ct"], text=True))
          assert manifest["format"] == 1 and manifest["version"] == version
          assert manifest["target"] == target and manifest["revision"] == os.environ["SUZAKU_ACCEPTED_REVISION"]
          assert manifest["source_dirty"] is False and manifest["build_libc"] == "glibc 2.39"
          assert manifest["source_date_epoch"] == epoch
          assert manifest["models_bundled"] is False and manifest["user_data_bundled"] is False
          print("PASS: exact four candidate assets, bound checksums and clean source manifests")
          PY
      - name: Upload accepted Linux packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suzaku-linux-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  desktop-check:
    name: Desktop compile check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-ci-v1-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-ci-v1-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check desktop code and test targets
        # Native GUI/IME behavior is exercised on Linux, not simulated here.
        run: cargo check --locked --features gpu --all-targets
